<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fist My Bump</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>👊 Fist My Bump</h1>
    <p class="subtitle">Tap the fist to bump!</p>

    <div class="fist-area" id="fistArea">
      <div class="fist" id="fist">👊</div>
      <div class="bump-text" id="bumpText">BUMP!</div>
    </div>

    <div class="counter">
      <span class="count-label">Fist bumps given</span>
      <span class="count-number" id="count">0</span>
    </div>

    <button class="reset-btn" id="resetBtn" title="Reset counter">Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
